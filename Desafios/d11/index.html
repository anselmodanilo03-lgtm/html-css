<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        #espaco {
            position: relative;
            height: 100vh;
            background: url('imagens/espaco.jpg') center center / cover no-repeat;
        }

        #astronauta {
            position: absolute;
            width: 300px;
            height: 300px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: url('imagens/astronauta.png') center center / contain no-repeat;
        }
    </style>
</head>
<body>
    <section id="espaco">
        <article id="astronauta"></article>
    </section>
</body>
</html>
