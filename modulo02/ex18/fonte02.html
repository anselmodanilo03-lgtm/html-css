<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Vartigo';
            src: url(fontes/Vartigo.otf) format('opentype'), url(fontes/Vartigo.ttf) url(truetype);
            font-weight: normal;
            font-style: normal;

            
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Vartigo', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quo fuga natus dicta eaque non nihil optio atque impedit maiores possimus voluptates nostrum tenetur aliquid, quisquam eveniet animi molestias veritatis cum?</p>
</body>
</html>
